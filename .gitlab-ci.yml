# AHB QSPI GitLab CI Pipeline
# Runs lint, CDC analysis, cocotb regression (8 tests), coverage merge,
# and ASIC synthesis (TSMC 65nm).
#
# Stages:
#   1. setup       - Clone repo, validate tool paths, fetch dependencies
#   2. lint        - Verilator lint
#   3. cdc         - SpyGlass CDC analysis
#   4. regression  - Cocotb regression with VCS code coverage
#   5. coverage    - Merge VCS coverage and generate report
#   6. synthesis   - ASIC synthesis with Design Compiler (TSMC 65nm),
#                    + opt-in Fusion Compiler partition PnR + LEC
#                    (manual, gated on RUN_FC_PNR)
#   7. fpga-deploy - Manual fpgahub-driven deploy + stress (needs FPGAHUB_BOARD/FPGAHUB_BOARD_TAG)
#   8. cleanup     - Remove workspace

stages:
  - setup
  - lint
  - cdc
  - regression
  - coverage
  - synthesis
  - fpga-deploy
  - cleanup

variables:
  # Disable GitLab's built-in checkout -- we clone manually
  GIT_STRATEGY: none
  # Workspace directory for the pipeline
  WORK_DIR: "${CI_BUILDS_DIR}/${CI_PROJECT_NAME}/${CI_PIPELINE_ID}"
  # Synopsys EDA tool paths
  VCS_HOME: /eda/synopsys/2022-23/RHELx86/VCS_2022.06-SP2
  VERDI_HOME: /eda/synopsys/2022-23/RHELx86/VERDI_2022.06-SP2
  SPYGLASS_HOME: /eda/synopsys/2022-23/RHELx86/SPYGLASS_2022.06-SP2/SPYGLASS_HOME
  DC_HOME: /eda/synopsys/2022-23/RHELx86/SYN_2022.12
  # ARM IP library path (Corstone-101, CG092 flash cache)
  ARM_IP_LIBRARY_PATH: /research/AAA/ip_library
  # Simulator selection for cocotb
  SIM: vcs

# ============================================================================
# Stage 1: Setup
# ============================================================================

clone:
  stage: setup
  script:
    # Remove stale workspaces from previous pipelines (older than 24h)
    - find "${CI_BUILDS_DIR}/${CI_PROJECT_NAME}" -maxdepth 1 -mindepth 1 -type d -mmin +1440 -exec rm -rf {} + 2>/dev/null || true
    - rm -rf "$WORK_DIR"
    - mkdir -p "$WORK_DIR"
    - git clone --branch "$CI_COMMIT_REF_NAME" --single-branch "$CI_REPOSITORY_URL" "$WORK_DIR"
    - cd "$WORK_DIR" && git checkout "$CI_COMMIT_SHA"
    - cd "$WORK_DIR" && git submodule update --init --recursive
    - echo "Cloned $CI_COMMIT_SHORT_SHA into $WORK_DIR"

preflight:
  stage: setup
  needs: [clone]
  script:
    - |
      echo "========================================"
      echo " Preflight Environment Check"
      echo "========================================"

      pass=0; fail=0

      check_dir() {
        local name="$1" path="$2"
        if [ -z "$path" ]; then
          echo "  FAIL  $name  (not set)"
          fail=$((fail + 1))
        elif [ -d "$path" ]; then
          echo "  OK    $name = $path"
          pass=$((pass + 1))
        else
          echo "  FAIL  $name = $path  (directory not found)"
          fail=$((fail + 1))
        fi
      }

      check_bin() {
        local name="$1" bin="$2"
        if command -v "$bin" > /dev/null 2>&1; then
          echo "  OK    $name  ($(command -v "$bin"))"
          pass=$((pass + 1))
        else
          echo "  FAIL  $name  ('$bin' not found on PATH)"
          fail=$((fail + 1))
        fi
      }

      echo ""
      echo "-- EDA Tools ----------------------------"
      check_dir "VCS_HOME"       "$VCS_HOME"
      check_dir "VERDI_HOME"     "$VERDI_HOME"
      check_dir "SPYGLASS_HOME"  "$SPYGLASS_HOME"
      check_dir "DC_HOME"        "$DC_HOME"

      echo ""
      echo "-- IP Libraries -------------------------"
      check_dir "ARM_IP_LIBRARY_PATH"              "$ARM_IP_LIBRARY_PATH"
      check_dir "Corstone-101 (cmsdk_ahb_to_apb)"  "$ARM_IP_LIBRARY_PATH/latest/Corstone-101/logical/cmsdk_ahb_to_apb"
      check_dir "CG092 Flash Cache"                 "$ARM_IP_LIBRARY_PATH/CG092/CG092-BU-50000-r2p0-00rel0/p_flash_cache_f0"
      check_dir "Precompiled SRAM (TSMC65)"         "/research/precompiled_mems/TSMC65"

      echo ""
      echo "-- Workspace ----------------------------"
      check_dir "WORK_DIR"      "$WORK_DIR"

      echo ""
      echo "-- Tool Binaries (with PATH set) --------"
      export PATH="$VCS_HOME/bin:$VERDI_HOME/bin:$DC_HOME/bin:$PATH"
      check_bin "vcs"             "vcs"
      check_bin "dc_shell"        "dc_shell"
      check_bin "verilator"       "verilator"
      check_bin "python3"         "python3"
      check_bin "cocotb-config"   "cocotb-config"

      echo ""
      echo "========================================"
      echo " Preflight Summary  PASS=$pass  FAIL=$fail"
      echo "========================================"

      if [ "$fail" -ne 0 ]; then
        echo ""
        echo "ERROR: $fail preflight check(s) failed."
        echo "Fix the paths in .gitlab-ci.yml variables or on the runner."
        exit 1
      fi

fetch-deps:
  stage: setup
  needs: [clone]
  script:
    - export SOCLABS_AHB_QSPI_DIR="$WORK_DIR"
    - export SOCLABS_SOCTOOLS_FLOW_DIR="$WORK_DIR/soctools_flow"
    # Download flash model if not present
    - |
      if [ ! -f "$WORK_DIR/verif/VIP/SST26VF064B.v" ]; then
        echo "Downloading SST26VF064B flash model..."
        make -C "$WORK_DIR" get_flash_model
      else
        echo "Flash model already present"
      fi
    # Generate makefile.flist for cocotb (resolves file paths from flists)
    - |
      echo "Generating cocotb file list..."
      export ARM_IP_LIBRARY_PATH="$ARM_IP_LIBRARY_PATH"
      export DESIGN_VC="$WORK_DIR/flist/Top/ahb_QSPI_SIM.flist"
      export SIM_TOP_DIR="$WORK_DIR/simulate/sim"
      mkdir -p "$SIM_TOP_DIR/cocotb"
      cd "$SIM_TOP_DIR/cocotb"
      python3 "$SOCLABS_SOCTOOLS_FLOW_DIR/bin/filelist_compile.py" \
        -m -f "$DESIGN_VC" \
        -o "$SIM_TOP_DIR/cocotb/makefile.flist"
    - echo "File list generated at $WORK_DIR/simulate/sim/cocotb/makefile.flist"
    - cat "$WORK_DIR/simulate/sim/cocotb/makefile.flist"

# ============================================================================
# Stage 2: Lint
# ============================================================================

verilator-lint:
  stage: lint
  needs: [clone, preflight, fetch-deps]
  script:
    - export SOCLABS_AHB_QSPI_DIR="$WORK_DIR"
    - export ARM_IP_LIBRARY_PATH="$ARM_IP_LIBRARY_PATH"
    - echo "Verilator version:" && verilator --version
    - make -C "$WORK_DIR" lint_verilator 2>&1 | tee verilator_lint.log
  after_script:
    - cp "$WORK_DIR/lint/ahb_qspi/"*.log . 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - verilator_lint.log
    expire_in: 30 days
  allow_failure: true

hal-lint:
  stage: lint
  needs: [clone, preflight]
  tags:
    - xcelium
  variables:
    XCELIUM_HOME: /eda/cadence/xcelium
  script:
    - export SOCLABS_AHB_QSPI_DIR="$WORK_DIR"
    - export ARM_IP_LIBRARY_PATH="$ARM_IP_LIBRARY_PATH"
    - export PATH="$XCELIUM_HOME/tools/bin:$PATH"
    # `| head -1` SIGPIPEs the tool under pipefail — keep the banner non-fatal.
    - echo "HAL version:"
    - hal -version 2>&1 | head -1 || true
    # Lint standalone modules (no external IP dependencies)
    - make -C "$WORK_DIR/lint" lint-standalone 2>&1 | tee hal_lint_standalone.log
    # Lint all modules including top-level (requires CG092 + Corstone-101)
    - make -C "$WORK_DIR/lint" lint-each 2>&1 | tee hal_lint_all.log
    # Generate reports
    - |
      for mod in qspi_controller qspi_clock_div apb_qspi_regs ahb_qspi_interface top_ahb_qspi; do
        make -C "$WORK_DIR/lint" report MODULE=$mod 2>&1 || true
      done
  after_script:
    - cp "$WORK_DIR/lint/"*_hal.log . 2>/dev/null || true
    - cp "$WORK_DIR/lint/"*_hal_report.txt . 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - "*_hal.log"
      - "*_hal_report.txt"
      - hal_lint_standalone.log
      - hal_lint_all.log
    expire_in: 30 days

# ============================================================================
# Stage 3: CDC Analysis
# ============================================================================

spyglass-cdc:
  stage: cdc
  needs: [clone, preflight]
  tags:
    - vcs
  script:
    - export SOCLABS_AHB_QSPI_DIR="$WORK_DIR"
    - export ARM_IP_LIBRARY_PATH="$ARM_IP_LIBRARY_PATH"
    - export SPYGLASS_HOME="$SPYGLASS_HOME"
    - export PATH="$SPYGLASS_HOME/bin:$PATH"
    - echo "SpyGlass CDC analysis for top_ahb_qspi"
    - make -C "$WORK_DIR/cdc" cdc 2>&1 | tee spyglass_cdc.log
  after_script:
    - cp "$WORK_DIR/cdc/top_ahb_qspi_cdc_summary.rpt" . 2>/dev/null || true
    - cp spyglass_cdc.log . 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - spyglass_cdc.log
      - top_ahb_qspi_cdc_summary.rpt
    expire_in: 30 days
  allow_failure: true

# ============================================================================
# Stage 4: Regression
# ============================================================================

.vcs_cocotb_setup: &vcs_cocotb_setup
  before_script:
    - export PATH="$VCS_HOME/bin:$VERDI_HOME/bin:$PATH"
    - export SOCLABS_AHB_QSPI_DIR="$WORK_DIR"
    - export SOCLABS_SOCTOOLS_FLOW_DIR="$WORK_DIR/soctools_flow"
    - export ARM_IP_LIBRARY_PATH="$ARM_IP_LIBRARY_PATH"
    - python3 -m pip install --user cocotb cocotbext-ahb numpy --quiet

cocotb-regression:
  stage: regression
  needs: [clone, preflight, fetch-deps]
  tags:
    - vcs
  <<: *vcs_cocotb_setup
  script:
    - echo "Python version:" && python3 --version
    - echo "cocotb version:" && python3 -m cocotb --version || cocotb-config --version
    # `| head -1` SIGPIPEs the tool under pipefail — keep the banner non-fatal.
    - echo "VCS version:"
    - vcs -ID 2>&1 | head -1 || true
    # Run cocotb tests with VCS code coverage
    - |
      export SIM_TOP_DIR="$WORK_DIR/simulate/sim"
      export SIM_DIR="$SIM_TOP_DIR"
      export COCOTB_SCRATCH_DIR="$SIM_TOP_DIR/cocotb/scratch"
      mkdir -p "$SIM_DIR"
      cd "$SIM_DIR"
      make -C "$WORK_DIR/verif/cocotb" clean SIM_BUILD="$COCOTB_SCRATCH_DIR"
      make -C "$WORK_DIR/verif/cocotb" sim \
        SIM=vcs \
        SIM_BUILD="$COCOTB_SCRATCH_DIR" \
        COMPILE_ARGS="-full64 -sverilog -timescale=1ns/1ns -kdb -cm line+tgl+fsm+branch+cond" \
        SIM_CMD_SUFFIX="-cm line+tgl+fsm+branch+cond"
  after_script:
    - mkdir -p cocotb
    - cp "$WORK_DIR/simulate/sim/cocotb/scratch/results.xml" cocotb/ 2>/dev/null || true
    - cp "$WORK_DIR/simulate/sim/cocotb/scratch/run.log"     cocotb/ 2>/dev/null || true
    # Collect VDB coverage database
    - mkdir -p coverage_vdbs
    - cp -r "$WORK_DIR/simulate/sim/cocotb/scratch/simv.vdb" coverage_vdbs/cocotb.vdb 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - cocotb/run.log
      - coverage_vdbs/
    reports:
      junit:
        - cocotb/results.xml
    expire_in: 30 days

# ============================================================================
# Stage 5: Coverage
# ============================================================================

coverage-report:
  stage: coverage
  needs:
    - job: clone
    - job: cocotb-regression
      artifacts: true
  tags:
    - vcs
  before_script:
    - export PATH="$VCS_HOME/bin:$VERDI_HOME/bin:$PATH"
    - export SOCLABS_AHB_QSPI_DIR="$WORK_DIR"
  script:
    - |
      echo "========================================"
      echo " Generating VCS Coverage Report"
      echo "========================================"

      # Collect all VDB directories that exist
      VDB_DIRS=""
      for vdb in coverage_vdbs/*.vdb; do
        if [ -d "$vdb" ]; then
          VDB_DIRS="$VDB_DIRS -dir $vdb"
          echo "  Found: $vdb"
        fi
      done

      if [ -z "$VDB_DIRS" ]; then
        echo "WARNING: No VDB coverage databases found. Skipping report."
        exit 0
      fi

      echo ""
      echo "-- Generating coverage report -----------"
      urg -full64 $VDB_DIRS \
        -report coverage_report \
        -elfile "$WORK_DIR/verif/cocotb/coverage_exclude.el" \
        -format both \
        -metric line+cond+fsm+tgl+branch \
        2>&1 | grep -E 'Note|Error|Warning' || true

      echo ""
      echo "-- Coverage Summary ---------------------"
      if [ -f coverage_report/dashboard.txt ]; then
        cat coverage_report/dashboard.txt
      else
        echo "  (dashboard.txt not found)"
      fi

      echo ""
      echo "Coverage report: coverage_report/dashboard.html"
  artifacts:
    when: always
    paths:
      - coverage_report/
    expose_as: "Coverage Report"
    expire_in: 30 days

# ============================================================================
# Stage 6: ASIC Synthesis (TSMC 65nm)
# ============================================================================

dc-synth-tsmc65:
  stage: synthesis
  needs: [clone, preflight]
  tags:
    - vcs
  script:
    - export PATH="$DC_HOME/bin:$PATH"
    - export SOCLABS_AHB_QSPI_DIR="$WORK_DIR"
    - export ARM_IP_LIBRARY_PATH="$ARM_IP_LIBRARY_PATH"
    # Informational banner only. `dc_shell -version` prints >3 lines, so
    # `head -3` closes the pipe early and dc_shell dies on SIGPIPE (exit
    # 141). Under the runner's `set -o pipefail` that aborts the whole
    # job *before synthesis runs* — which is exactly the "No files to
    # upload" failure (after_script finds no reports). `|| true` makes
    # the banner non-fatal; the real dc_shell run below still gates.
    - echo "Design Compiler version:"
    - dc_shell -version 2>&1 | head -3 || true
    - mkdir -p "$WORK_DIR/imp/ASIC"
    - |
      cd "$WORK_DIR/asic/TSMC65nm"
      dc_shell -f dc_synthesis_core.tcl 2>&1 | tee dc_synth.log
      DC_EXIT=$?
      if [ $DC_EXIT -ne 0 ]; then
        echo "ERROR: dc_shell exited with code $DC_EXIT"
        exit 1
      fi
    # Check that gate-level netlist was produced
    - |
      if [ ! -f "$WORK_DIR/imp/ASIC/top_ahb_qspi_gates.v" ]; then
        echo "ERROR: Gate-level netlist not generated"
        exit 1
      fi
      echo "Gate-level netlist size: $(wc -l < "$WORK_DIR/imp/ASIC/top_ahb_qspi_gates.v") lines"
    # Print timing summary
    - |
      echo ""
      echo "========================================"
      echo " Synthesis Reports Summary"
      echo "========================================"
      if [ -f "$WORK_DIR/imp/ASIC/top_ahb_qspi_qor.rep" ]; then
        echo "-- QoR Report ---------------------------"
        cat "$WORK_DIR/imp/ASIC/top_ahb_qspi_qor.rep"
      fi
  after_script:
    - cp "$WORK_DIR/asic/TSMC65nm/dc_synth.log" . 2>/dev/null || true
    - cp "$WORK_DIR/imp/ASIC/top_ahb_qspi_area.rep" . 2>/dev/null || true
    - cp "$WORK_DIR/imp/ASIC/top_ahb_qspi_power.rep" . 2>/dev/null || true
    - cp "$WORK_DIR/imp/ASIC/top_ahb_qspi_timing.rep" . 2>/dev/null || true
    - cp "$WORK_DIR/imp/ASIC/top_ahb_qspi_qor.rep" . 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - dc_synth.log
      - top_ahb_qspi_area.rep
      - top_ahb_qspi_power.rep
      - top_ahb_qspi_timing.rep
      - top_ahb_qspi_qor.rep
    expire_in: 30 days

# Fusion Compiler partition PnR + Formality LEC (TSMC 65nm).
#
# Runs the full hierarchical partition flow (init→synth→cts→route→
# signoff→export→DRC) THEN Formality LEC via `make fc_all`, then
# re-verifies the hand-off drop with verify_partition_handoff.sh.
#
# Opt-in + manual + allow_failure on purpose:
#   - it is a multi-hour place&route run, not something to block every
#     push on (cf. dc-synth-tsmc65 above which is only synthesis);
#   - the flow is not yet silicon-validated (see
#     syn/asic/fusion-compiler/INTEGRATION_CHANGES.md — verified only by
#     Tcl info-complete + make -n, never a live fc_shell run).
#
# PROMOTION PATH — once a clean `make fc_all` + verify run is achieved
# on the runner: drop `allow_failure`, drop `when: manual`, and widen
# the rule (e.g. run on the integration branch) so it becomes a real
# gate. The Makefiles already self-enforce FC_STAGE_OK / FM_LEC_OK, so
# a non-zero exit here is trustworthy.
fc-pnr-lec-tsmc65:
  stage: synthesis
  when: manual
  needs: [clone, preflight]
  tags:
    - vcs
  rules:
    - if: '$RUN_FC_PNR != ""'
  allow_failure: true
  script:
    - export SOCLABS_AHB_QSPI_DIR="$WORK_DIR"
    - export ARM_IP_LIBRARY_PATH="$ARM_IP_LIBRARY_PATH"
    # FC / Formality tool paths are set by the flow Makefiles themselves
    # (FC_BIN_DIR / FM_BIN_DIR), so nothing to export here.
    - echo "Fusion Compiler partition flow + LEC for top_ahb_qspi"
    - make -C "$WORK_DIR/syn/asic/fusion-compiler" fc_all 2>&1 | tee fc_all.log
    # Hand-off self-check: re-hash every delivered file against the
    # manifest FC wrote, and surface scenario/hold coverage.
    - "$WORK_DIR/syn/asic/scripts/verify_partition_handoff.sh"
    # Echo the DRC tier-0/1/1b summary into the job log.
    - make -C "$WORK_DIR/syn/asic/fusion-compiler" drc_summary || true
  after_script:
    - mkdir -p fc_reports
    - cp "$WORK_DIR/syn/asic/fusion-compiler/reports/"*.rep      fc_reports/ 2>/dev/null || true
    - cp "$WORK_DIR/syn/asic/fusion-compiler/reports/06_abstract_manifest.txt" fc_reports/ 2>/dev/null || true
    - cp "$WORK_DIR/syn/asic/formality/reports/"*.rep            fc_reports/ 2>/dev/null || true
    - cp fc_all.log fc_reports/ 2>/dev/null || true
    # ---- Partition hand-off drop for downstream hierarchical FC ----
    # GitLab artifact paths are relative to the job working dir (NOT
    # $WORK_DIR), so stage the drop here with the same copy-back pattern
    # every job in this file uses. fc_handoff/ is self-contained: the
    # outputs/ payload + its SHA256 manifest + the NDM design library +
    # a consumer README, so a parent FC pipeline can fetch this one
    # directory and either open_lib the block or verify-and-consume the
    # physical/timing views.
    - mkdir -p fc_handoff
    - cp -r "$WORK_DIR/syn/asic/fusion-compiler/outputs/." fc_handoff/ 2>/dev/null || true
    # Manifest lives in reports/, not outputs/ — copy it alongside the
    # payload so verify_partition_handoff.sh works with one dir.
    - cp "$WORK_DIR/syn/asic/fusion-compiler/reports/06_abstract_manifest.txt" fc_handoff/ 2>/dev/null || true
    # NDM design library (lib/tech/attach + all stage blocks, ~24M).
    # The FC-native partition abstract is the block
    #   top_ahb_qspi.dlib:top_ahb_qspi/signoff.design
    # Tar it so a parent FC pipeline can fetch and open_lib it directly.
    # 6_partition_export.tcl's NOTE: this .dlib IS the partition abstract
    # for FC's hierarchical PnR flow (ETM is unavailable in fc 2022.12).
    - |
      DLIB="$WORK_DIR/syn/asic/fusion-compiler/work/top_ahb_qspi.dlib"
      if [ -d "$DLIB" ]; then
        tar -C "$WORK_DIR/syn/asic/fusion-compiler/work" \
            -czf fc_handoff/top_ahb_qspi.dlib.tar.gz top_ahb_qspi.dlib \
          && echo "Packaged NDM: fc_handoff/top_ahb_qspi.dlib.tar.gz" \
          || echo "WARNING: NDM .dlib package failed (non-fatal)"
      else
        echo "WARNING: top_ahb_qspi.dlib not found — NDM not packaged"
      fi
    - |
      cat > fc_handoff/HANDOFF_README.txt <<'EOF'
      AHB-QSPI partition hand-off — top_ahb_qspi (TSMC 65nm)

      Physical/timing payload : ./ — LEF/DEF/GDS/UPF/Verilog/SDC +
                                per-scenario SDF/SPEF, each SHA256-pinned
                                in 06_abstract_manifest.txt (provenance:
                                source signoff block + scenario coverage).
      FC-native abstract      : top_ahb_qspi.dlib.tar.gz
                                  tar xzf top_ahb_qspi.dlib.tar.gz
                                  open_lib  top_ahb_qspi.dlib
                                  open_block top_ahb_qspi.dlib:top_ahb_qspi/signoff.design
      LEC sign-off            : fc_reports/03_verify_summary.rep
                                (RTL vs post-layout netlist).
      Verify this drop        : run, from the repo,
                                  syn/asic/scripts/verify_partition_handoff.sh \
                                    <thisdir>/06_abstract_manifest.txt <thisdir>
                                exit 0 = every file present & SHA matches.
      EOF
  artifacts:
    when: always
    paths:
      - fc_reports/
      - fc_handoff/
    expose_as: "FC partition hand-off"
    expire_in: 30 days

# ============================================================================
# Stage 7: FPGA Deploy (manual — requires a live fpgahub daemon + board)
# ============================================================================
#
# Acquires a board via fpgahub (by name or capability), then runs
# `make stress` from the fpga Makefile. The Makefile's helpers detect
# the existing FPGA_BOARD/FPGA_LEASE_TOKEN env and re-use the outer lease
# (no nested acquire). after_script releases cleanly so a failed job
# never leaks the board. Gated on FPGAHUB_BOARD / FPGAHUB_BOARD_TAG CI
# variables — leave both unset and the job is skipped.

fpga-deploy:
  stage: fpga-deploy
  when: manual
  needs: [clone]
  rules:
    - if: '$FPGAHUB_BOARD != "" || $FPGAHUB_BOARD_TAG != ""'
  variables:
    FPGAHUB_TTL: "3600"
    FPGAHUB_WAIT: "600"
  script:
    - |
      set -euo pipefail
      if [ -n "${FPGAHUB_BOARD:-}" ]; then
        fpgahub lease acquire "$FPGAHUB_BOARD" \
          --ttl "$FPGAHUB_TTL" --wait "$FPGAHUB_WAIT" --json > lease.json
      else
        fpgahub lease acquire --capability "$FPGAHUB_BOARD_TAG" \
          --ttl "$FPGAHUB_TTL" --wait "$FPGAHUB_WAIT" --json > lease.json
      fi
      export FPGA_BOARD="$(jq -r .board lease.json)"
      export FPGA_LEASE_TOKEN="$(jq -r .token lease.json)"
      echo "Leased $FPGA_BOARD (token=${FPGA_LEASE_TOKEN:0:8}…)"
    - export SOCLABS_AHB_QSPI_DIR="$WORK_DIR"
    - export ARM_IP_LIBRARY_PATH="$ARM_IP_LIBRARY_PATH"
    # build_design has no lease cost; do it under the lease anyway so a
    # single fpga-deploy job carries the change from clone → board.
    - make -C "$WORK_DIR/fpga" build_design 2>&1 | tee fpga_build.log
    # `make stress` invokes with_lease.sh which detects the existing
    # FPGA_BOARD / FPGA_LEASE_TOKEN and reuses them. BOARD= is forwarded
    # to the wrapper for the assertion only — the lease isn't re-acquired.
    # runner.py logs to stdout (incl. its end-of-run per-test summary and
    # streamed failure lines), so tee'ing the stress console preserves
    # the hardware-test verdict as a downloadable artifact. The
    # `set -o pipefail` set in the lease block above still applies, so a
    # stress failure fails the job (tee does not mask it).
    - export FPGA_BOARD FPGA_LEASE_TOKEN
    - make -C "$WORK_DIR/fpga" stress BOARD="$FPGA_BOARD" 2>&1 | tee fpga_stress.log
  after_script:
    - |
      if [ -f lease.json ]; then
        board=$(jq -r .board lease.json)
        token=$(jq -r .token lease.json)
        fpgahub lease release "$board" --token "$token" || true
      fi
    # ---- Hardware-test evidence (mirrors the FC hand-off capture) ----
    # Artifact paths are relative to the job working dir, so stage the
    # build + stress console logs plus the Vivado build/package logs here
    # (same $WORK_DIR->relative copy-back pattern the rest of the file
    # uses). when:always means a failed stress still uploads its log.
    - mkdir -p fpga_results
    - mv fpga_build.log fpga_stress.log fpga_results/ 2>/dev/null || true
    - cp lease.json fpga_results/ 2>/dev/null || true
    - cp "$WORK_DIR/imp/fpga/run/"*.log fpga_results/ 2>/dev/null || true
    - cp "$WORK_DIR/imp/fpga/run/"*.jou fpga_results/ 2>/dev/null || true
    # runner.py's machine-readable qspi_stress_summary.json /
    # qspi_stress_failures.jsonl are now scp'd off the board by the
    # harness (run_stress.sh, under the active lease — see fpga/Makefile
    # FPGA_STRESS_RESULTS*) into $(BUILD_DIR)/stress. Capture them too.
    - cp -r "$WORK_DIR/imp/fpga/stress/." fpga_results/ 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - lease.json
      - fpga_results/
    expose_as: "FPGA hardware stress"
    expire_in: 30 days

# ============================================================================
# Stage 8: Cleanup
# ============================================================================

cleanup:
  stage: cleanup
  when: always
  script:
    - rm -rf "$WORK_DIR" || true
    - echo "Cleaned up $WORK_DIR"
